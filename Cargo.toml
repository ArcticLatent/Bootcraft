[workspace]
resolver = "3"
members = ["crates/core", "crates/helper"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ArcticLatent/Bootcraft"
authors = ["Burce Boran"]

[workspace.dependencies]
bootcraft-core = { path = "crates/core" }
clap = { version = "4", features = ["derive"] }
insta = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
