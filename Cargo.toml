[workspace]
resolver = "3"
members = ["crates/app", "crates/core", "crates/helper", "tools/manifest-signer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ArcticLatent/Bootcraft"
authors = ["Burce Boran"]
# Edition 2024 with let chains.
rust-version = "1.88"

[workspace.dependencies]
base64 = "0.22"
bootcraft-core = { path = "crates/core" }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
insta = "1"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
