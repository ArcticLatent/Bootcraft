name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Distributions rename and drop packages; catch it even without commits.
  schedule:
    - cron: "17 5 * * 1"

jobs:
  core:
    name: core and helper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy -p bootcraft-core -p bootcraft-helper --all-targets -- -D warnings
      - run: cargo test -p bootcraft-core -p bootcraft-helper

  app:
    name: app (Qt 6 on Arch)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git rust qt6-base qt6-declarative qt6-svg
      - uses: actions/checkout@v4
      - run: cargo clippy -p bootcraft --all-targets -- -D warnings
      - run: cargo test -p bootcraft
      - name: Interface loads
        # Renders the window off-screen and saves it; fails if any QML fails to load.
        run: |
          cargo build -p bootcraft
          QT_FORCE_STDERR_LOGGING=1 QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software \
            timeout 120 target/debug/bootcraft --screenshot=/tmp/overview.png
          test -s /tmp/overview.png

  packages:
    name: package names (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [arch, fedora, debian, ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p bootcraft-helper --target x86_64-unknown-linux-musl
      - name: Every package exists in the real repositories
        run: CONTAINER=docker scripts/check-packages.sh ${{ matrix.distro }}
